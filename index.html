<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Turn screen time into life skills. Kids solve challenges and earn rewards across three jars: Family experiences, Investing, and Giving.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://3jars.ai/">
<meta property="og:title" content="3 Jars — Turn screen time into life skills">
<meta property="og:description" content="Kids solve challenges and earn rewards across three jars: Family experiences, Investing, and Giving.">
<meta property="og:image" content="https://3jars.ai/hero-3jars.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="3 Jars — Turn screen time into life skills">
<meta name="twitter:description" content="Kids solve challenges and earn rewards across three jars: Family experiences, Investing, and Giving.">
<meta name="twitter:image" content="https://3jars.ai/hero-3jars.png">
<link rel="canonical" href="https://3jars.ai/">
<title>3 Jars</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: #f8f5ef;
    color: #1f1b2e;
    overflow-x: hidden;
    letter-spacing: -0.005em;
    position: relative;
  }
  /* Ambient mesh-gradient blobs */
  body::before, body::after {
    content: ''; position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(100px);
  }
  body::before {
    top: -240px; left: -200px; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(252, 211, 77, 0.45), transparent 70%);
  }
  body::after {
    top: 260px; right: -300px; width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(244, 114, 182, 0.26), transparent 70%);
  }
  .bg-blob-3 {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(110px);
    bottom: -240px; left: 30%; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(129, 140, 248, 0.28), transparent 70%);
  }

  /* Account bar */
  .account-bar {
    position: fixed; top: 32px; right: 16px; z-index: 8500;
    display: flex; align-items: center; gap: 10px;
    font-size: 0.8em; color: rgba(0,0,0,0.45);
  }
  .account-bar a { color: rgba(0,0,0,0.5); text-decoration: none; cursor: pointer; }
  .account-bar a:hover { color: #fbbf24; }

  /* Accuracy bar */
  .error-bar-container {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9000;
    background: rgba(255,248,240,0.97); padding: 6px 16px;
    display: flex; align-items: center; gap: 10px;
    font-size: 0.8em; backdrop-filter: blur(8px);
  }
  .error-bar-label { color: rgba(0,0,0,0.65); font-weight: 600; white-space: nowrap; min-width: 70px; }
  .error-bar-track { flex: 1; height: 10px; background: rgba(0,0,0,0.08); border-radius: 5px; position: relative; overflow: visible; }
  .error-bar-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease, background 0.5s ease; }
  .error-bar-threshold { position: absolute; left: 75%; top: -3px; bottom: -3px; width: 2px; background: #fbbf24; border-radius: 1px; }
  .error-bar-threshold::after { content: '75%'; position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 0.75em; color: #fbbf24; white-space: nowrap; }
  .error-bar-pct { color: #2d2d2d; font-weight: 700; min-width: 45px; text-align: right; }
  .error-bar-pts { color: #fbbf24; font-weight: 700; min-width: 60px; text-align: right; white-space: nowrap; }

  .container {
    position: relative; z-index: 10;
    max-width: 760px; width: 100%;
    margin: 0 auto;
    padding: 30px 20px;
  }
  /* Let the content use more of the screen on larger viewports so the
     game tiles and category rows feel full-size instead of being
     squeezed into the middle of a sea of white space. Breakpoints are
     aimed at any non-phone viewport. */
  @media (min-width: 820px)  { .container { max-width: 880px;  padding: 30px 28px; } }
  @media (min-width: 1100px) { .container { max-width: 1040px; padding: 32px 32px; } }
  @media (min-width: 1400px) { .container { max-width: 1200px; padding: 40px 40px; } }

  /* ---- HERO ---- */
  .hero { text-align: center; padding: 40px 0 30px; }
  .hero-label {
    font-size: 0.75em; text-transform: uppercase; letter-spacing: 6px;
    color: rgba(0,0,0,0.35); margin-bottom: 10px;
  }
  .hero-title {
    font-size: 4em; font-weight: 900;
    background: linear-gradient(135deg, #fbbf24, #f472b6, #818cf8, #34d399);
    background-size: 300% 300%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: grad 6s ease infinite;
    margin-bottom: 8px;
  }
  @keyframes grad { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .hero-tagline { font-size: 1.15em; color: rgba(0,0,0,0.45); margin-bottom: 36px; }

  /* 3 Jar hero cards */
  .jars-hero { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .jar-hero-card {
    width: 200px; padding: 28px 18px 24px; border-radius: 22px;
    text-align: center; transition: transform 0.3s, box-shadow 0.3s; cursor: default;
  }
  .jar-hero-card:hover { transform: translateY(-5px); }
  .jar-hero-card.present {
    background: linear-gradient(160deg, rgba(251,191,36,0.15), rgba(251,191,36,0.05));
    border: 1px solid rgba(251,191,36,0.3);
  }
  .jar-hero-card.invest {
    background: linear-gradient(160deg, rgba(52,211,153,0.15), rgba(52,211,153,0.05));
    border: 1px solid rgba(52,211,153,0.3);
  }
  .jar-hero-card.give {
    background: linear-gradient(160deg, rgba(167,139,250,0.15), rgba(167,139,250,0.05));
    border: 1px solid rgba(167,139,250,0.3);
  }
  .jar-emoji { font-size: 2.6em; margin-bottom: 10px; display: block; animation: jarBob 3s ease-in-out infinite; }
  .jar-hero-card.invest .jar-emoji { animation-delay: 0.4s; }
  .jar-hero-card.give .jar-emoji { animation-delay: 0.8s; }
  @keyframes jarBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .jar-name { font-size: 0.75em; text-transform: uppercase; letter-spacing: 2px; color: rgba(0,0,0,0.45); margin-bottom: 6px; }
  .jar-amount { font-size: 1.9em; font-weight: 800; }
  .jar-hero-card.present .jar-amount { color: #fbbf24; }
  .jar-hero-card.invest .jar-amount { color: #34d399; }
  .jar-hero-card.give .jar-amount { color: #a78bfa; }
  .jar-desc { font-size: 0.75em; color: rgba(0,0,0,0.35); margin-top: 6px; line-height: 1.3; }

  .progress-row { max-width: 480px; margin: 0 auto 10px; text-align: center; }
  .progress-label { font-size: 0.78em; color: rgba(0,0,0,0.35); margin-bottom: 6px; }
  .progress-track { height: 6px; background: rgba(0,0,0,0.08); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #fbbf24, #34d399, #a78bfa); transition: width 0.5s; }
  .jars-link { display: inline-block; margin-top: 10px; font-size: 0.8em; color: rgba(0,0,0,0.4); text-decoration: none; transition: color 0.2s; }
  .jars-link:hover { color: #fbbf24; }
  .jars-section-bottom { margin-top: 36px; text-align: center; }
  .jars-bottom-heading { font-size: 0.85em; text-transform: uppercase; letter-spacing: 3px; color: rgba(0,0,0,0.4); margin-bottom: 20px; }
  .no-player-msg { font-size: 0.85em; color: rgba(0,0,0,0.3); }
  .no-player-msg { color: rgba(0,0,0,0.3); font-size: 0.9em; padding: 20px 0; }

  /* ---- PLAYER STRIP ---- */
  .player-strip {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    padding: 24px 0; margin-bottom: 8px;
    border-top: 1px solid rgba(0,0,0,0.06);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .player-chip {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.03); border: 2px solid rgba(0,0,0,0.08);
    border-radius: 50px; padding: 6px 16px 6px 6px;
    cursor: pointer; transition: all 0.2s; position: relative;
  }
  .player-chip:hover { border-color: rgba(0,0,0,0.2); background: rgba(0,0,0,0.05); }
  .player-chip.selected { border-color: #f59e0b; background: rgba(251,191,36,0.1); }
  .chip-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.1em;
  }
  .chip-info { text-align: left; }
  .chip-name { font-size: 0.85em; font-weight: 700; color: #2d2d2d; }
  .chip-pts { font-size: 0.68em; color: #fbbf24; font-weight: 600; }
  .chip-remove {
    position: absolute; top: -6px; right: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.08); border: none;
    color: rgba(0,0,0,0.4); font-size: 0.6em;
    cursor: pointer; display: none; align-items: center; justify-content: center;
  }
  .player-chip:hover .chip-remove { display: flex; }
  .chip-remove:hover { background: #f87171; color: #2d2d2d; }
  .add-chip {
    border-style: dashed; opacity: 0.5;
  }
  .add-chip:hover { opacity: 0.8; }
  .prompt-msg {
    text-align: center; margin-bottom: 8px;
    font-size: 0.9em; color: rgba(0,0,0,0.4); transition: all 0.3s;
  }
  .prompt-msg.active { color: #fbbf24; font-weight: 600; }

  /* ---- GARDEN (Play Mix growing plants) ---- */
  .garden-summary {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 14px 20px;
    margin: 4px auto 16px;
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 8px 24px -12px rgba(17, 24, 39, 0.08);
  }
  .garden-summary-title {
    font-size: 0.68em; letter-spacing: 0.18em;
    color: #7c3aed; font-weight: 700; text-transform: uppercase;
  }
  .garden-summary-title::before { content: '🌿'; margin-right: 6px; }
  .garden-summary-sub {
    font-size: 0.8em; color: #64748b; margin-top: 4px; letter-spacing: -0.005em;
  }
  .garden-summary-total {
    font-size: 1.9em; font-weight: 800; color: #1f1b2e;
    letter-spacing: -0.03em; line-height: 1;
  }
  .garden-summary-total small {
    font-size: 0.42em; color: #94a3b8; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; margin-left: 6px;
    display: inline-block; vertical-align: 0.4em;
  }
  .garden-nudge {
    margin: 0 auto 16px;
    padding: 11px 18px;
    font-size: 0.86em;
    color: #92400e;
    background: linear-gradient(135deg, rgba(252, 211, 77, 0.28), rgba(251, 191, 36, 0.18));
    backdrop-filter: blur(10px);
    border-radius: 14px; text-align: center;
    border: 1px solid rgba(252, 211, 77, 0.4);
    max-width: 580px; letter-spacing: -0.005em;
  }
  .garden-nudge.hidden { display: none; }
  .garden-empty {
    text-align: center; font-size: 0.82em; color: rgba(0,0,0,0.4);
    padding: 10px 0 0;
  }

  /* Category row cards */
  .cat-row {
    display: grid; grid-template-columns: 110px 1fr; gap: 12px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    border-radius: 20px;
    padding: 14px 18px 14px 12px;
    margin: 0 auto 12px;
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 8px 24px -12px rgba(17, 24, 39, 0.08);
    align-items: center;
    transition: box-shadow 0.3s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }
  .cat-row::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    border-radius: inherit; opacity: 0.55;
  }
  .cat-row[data-cat="math"]::before {
    background: linear-gradient(120deg, rgba(252, 211, 77, 0.12), transparent 45%);
  }
  .cat-row[data-cat="language"]::before {
    background: linear-gradient(120deg, rgba(244, 114, 182, 0.1), transparent 45%);
  }
  .cat-row[data-cat="challenges"]::before {
    background: linear-gradient(120deg, rgba(129, 140, 248, 0.12), transparent 45%);
  }
  .cat-row:hover {
    box-shadow: 0 2px 4px rgba(17,24,39,0.05), 0 14px 40px -16px rgba(124, 58, 237, 0.18);
  }
  .cat-plant {
    position: relative; width: 100%; height: 136px;
  }
  .cat-plant svg { width: 100%; height: 100%; display: block; }
  .pct-badge {
    position: absolute; top: 0; right: 0;
    background: white; color: #1f1b2e; font-weight: 800; font-size: 0.7em;
    padding: 3px 9px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(17,24,39,0.08);
    border: 1px solid rgba(17, 24, 39, 0.06);
    letter-spacing: -0.01em;
  }
  .cat-row[data-cat="math"] .pct-badge { color: #92400e; }
  .cat-row[data-cat="language"] .pct-badge { color: #9d174d; }
  .cat-row[data-cat="challenges"] .pct-badge { color: #3730a3; }
  .cat-main { display: flex; flex-direction: column; gap: 9px; position: relative; z-index: 1; }
  .cat-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.72em; letter-spacing: 0.1em;
    color: #2b2440;
  }
  .cat-head .cat-icon {
    font-size: 1.25em; letter-spacing: 0;
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 10px;
  }
  .cat-row[data-cat="math"] .cat-icon { background: #fde68a; }
  .cat-row[data-cat="language"] .cat-icon { background: #fce7f3; }
  .cat-row[data-cat="challenges"] .cat-icon { background: #e0e7ff; }
  .cat-name {
    font-size: 1em; font-weight: 700; color: #1f1b2e;
    letter-spacing: -0.015em; text-transform: none;
  }
  .cat-count {
    margin-left: auto; color: #94a3b8;
    font-weight: 500; letter-spacing: 0.02em; text-transform: none;
    font-size: 0.88em;
  }
  .cat-tiles {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .cat-tiles .game-tile {
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 0.85em;
    gap: 10px;
  }
  .cat-tiles .game-tile .game-tile-icon { font-size: 1.15em; width: 24px; }
  .cat-tiles .game-tile .game-tile-name { font-size: 0.95em; }
  .cat-tiles .game-tile .game-tile-pts { font-size: 0.72em; }

  /* Plant growth transitions */
  .stem, .leaf, .flower, .bud { transition: all 0.85s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: center bottom; }
  .leaf, .flower, .bud { opacity: 0; transform: scale(0); transform-origin: center center; }
  .seed { opacity: 0; transition: opacity 0.4s; }
  .cat-plant[data-stage="0"] .seed { opacity: 1; animation: seedWiggle 3s ease-in-out infinite; }
  @keyframes seedWiggle { 0%,100% { transform: rotate(0); } 50% { transform: rotate(2deg); } }
  .cat-plant[data-stage="0"] .stem { transform: scaleY(0); }
  .cat-plant[data-stage="1"] .stem { transform: scaleY(0.3); }
  .cat-plant[data-stage="2"] .stem { transform: scaleY(0.55); }
  .cat-plant[data-stage="3"] .stem { transform: scaleY(0.8); }
  .cat-plant[data-stage="4"] .stem { transform: scaleY(1); }
  .cat-plant[data-stage="1"] .leaf-1, .cat-plant[data-stage="1"] .leaf-2 { opacity: 1; transform: scale(1); }
  .cat-plant[data-stage="2"] .leaf-1, .cat-plant[data-stage="2"] .leaf-2,
  .cat-plant[data-stage="2"] .leaf-3, .cat-plant[data-stage="2"] .leaf-4 { opacity: 1; transform: scale(1); }
  .cat-plant[data-stage="3"] .leaf-1, .cat-plant[data-stage="3"] .leaf-2, .cat-plant[data-stage="3"] .leaf-3,
  .cat-plant[data-stage="3"] .leaf-4, .cat-plant[data-stage="3"] .leaf-5, .cat-plant[data-stage="3"] .leaf-6 { opacity: 1; transform: scale(1); }
  .cat-plant[data-stage="3"] .bud { opacity: 1; transform: scale(1); }
  .cat-plant[data-stage="4"] .leaf-1, .cat-plant[data-stage="4"] .leaf-2, .cat-plant[data-stage="4"] .leaf-3,
  .cat-plant[data-stage="4"] .leaf-4, .cat-plant[data-stage="4"] .leaf-5, .cat-plant[data-stage="4"] .leaf-6,
  .cat-plant[data-stage="4"] .leaf-7, .cat-plant[data-stage="4"] .leaf-8 { opacity: 1; transform: scale(1); }
  .cat-plant[data-stage="4"] .flower { opacity: 1; transform: scale(1); animation: flowerSway 4s ease-in-out infinite; }
  @keyframes flowerSway { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.05) rotate(3deg); } }

  @media (max-width: 600px) {
    .cat-row { grid-template-columns: 92px 1fr; padding: 12px 14px 12px 8px; }
    .cat-plant { height: 118px; }
    .cat-tiles { grid-template-columns: 1fr; }
  }

  /* ---- GAMES GRID ---- */
  .games-area { padding: 30px 0; }
  .games-heading {
    font-size: 0.8em; text-transform: uppercase; letter-spacing: 3px;
    color: rgba(0,0,0,0.4); margin-bottom: 16px; text-align: center;
  }
  .cat-label {
    font-size: 0.68em; text-transform: uppercase; letter-spacing: 2px;
    color: rgba(0,0,0,0.35); padding: 14px 0 6px;
    grid-column: 1 / -1;
  }
  .cat-label:first-child { padding-top: 0; }
  .games-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin: 0 auto;
  }
  .game-tile {
    background: white; border: 1px solid rgba(0,0,0,0.08);
    border-radius: 14px; padding: 16px 18px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: all 0.2s; text-decoration: none; color: #2d2d2d;
  }
  .game-tile:hover {
    background: #fff; border-color: rgba(0,0,0,0.15); box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  .game-tile.needs-player { opacity: 0.45; cursor: not-allowed; }
  .game-tile.needs-player:hover { transform: none; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  @keyframes shrineGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(255, 180, 50, 0.3), 0 2px 8px rgba(0,0,0,0.04); }
    50% { box-shadow: 0 0 20px rgba(255, 180, 50, 0.6), 0 0 40px rgba(255, 140, 0, 0.2); }
  }
  .game-tile.shrine-glow {
    animation: shrineGlow 2.5s ease-in-out infinite;
    border-color: rgba(255, 180, 50, 0.4);
    background: linear-gradient(135deg, #fff9f0 0%, #fff 100%);
  }
  .game-tile.shrine-glow:hover {
    animation: none;
    box-shadow: 0 0 24px rgba(255, 180, 50, 0.7), 0 4px 16px rgba(0,0,0,0.1);
    transform: translateY(-3px);
  }
  .game-tile-icon { font-size: 1.4em; flex-shrink: 0; width: 32px; text-align: center; }
  .game-tile-info { flex: 1; min-width: 0; }
  .game-tile-name { font-size: 0.9em; font-weight: 600; }
  .game-tile-pts { font-size: 0.68em; color: rgba(0,0,0,0.4); margin-top: 1px; }
  .game-tile-pts.hot { color: #fbbf24; }

  .exam-row { grid-column: 1 / -1; text-align: center; margin-top: 16px; }
  .exam-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #dc2626, #991b1b);
    color: #2d2d2d; padding: 14px 34px; border-radius: 50px;
    font-size: 1.05em; font-weight: 700; text-decoration: none;
    border: none; cursor: pointer; transition: transform 0.2s;
  }
  .exam-btn:hover { transform: scale(1.05); }
  .exam-btn.needs-player { opacity: 0.5; cursor: not-allowed; }
  .exam-btn.needs-player:hover { transform: none; }

  /* ---- PHILOSOPHY ---- */
  .philosophy {
    max-width: 580px; margin: 10px auto 0; padding: 28px;
    background: rgba(251,191,36,0.05); border: 1px solid rgba(251,191,36,0.15);
    border-radius: 18px; text-align: center;
  }
  .philosophy h3 { font-size: 1em; color: rgba(0,0,0,0.6); margin-bottom: 10px; }
  .philosophy p { font-size: 0.83em; color: rgba(0,0,0,0.45); line-height: 1.7; }

  /* Guest banner */
  .guest-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9500;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #2d2d2d; text-align: center; padding: 10px 16px;
    font-size: 0.88em; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .guest-banner a {
    background: #2d2d2d; color: white; padding: 5px 16px;
    border-radius: 20px; text-decoration: none; font-size: 0.85em;
    font-weight: 700; transition: opacity 0.2s;
  }
  .guest-banner a:hover { opacity: 0.85; }

  .footer {
    text-align: center; padding: 24px 0; color: rgba(0,0,0,0.25); font-size: 0.8em;
  }
  .reset-btn {

  // ---- Account check ----
  const isGuest = sessionStorage.getItem('km_guest') === 'true';

    if (backup) { sessionStorage.setItem('km_currentAccount', backup); currentAccountId = backup; }
    else { window.location.href = 'login.html'; throw new Error('No account'); }
  }
  let selectedPlayer = '';

            '<circle cx="46" cy="38" r="3"/>' +
            '<circle cx="54" cy="38" r="3"/>' +

            '<circle cx="50" cy="24" r="2"/>' +
            '<circle cx="50" cy="32" r="2"/>' +
          '</g>' +
        '</g>';
    }
    var pot = '<path d="M 22 110 L 30 150 L 70 150 L 78 110 Z" fill="#c2410c"/>' +
      '<path d="M 22 110 L 30 150 L 70 150 L 78 110 Z" fill="url(#shade-' + cat + ')" opacity="0.25"/>' +
      '<rect x="20" y="108" width="60" height="7" fill="#9a3412" rx="2"/>' +

        '<stop offset="1" stop-color="#000" stop-opacity="0.5"/>' +
      '</linearGradient></defs>';
    return '<svg viewBox="0 0 100 160" preserveAspectRatio="xMidYMid meet">' + common + flower + pot + '</svg>';
  }
  function catRow(cat, icon, name, mix, total, tilesHTML) {
    var count = mix[cat] || 0;
    var pct = total ? (count / total) * 100 : 0;
    var stage = stageFor(pct, total);
    var pctDisplay = total === 0 ? '—' : Math.round(pct) + '%';
    return '<div class="cat-row" data-cat="' + cat + '">' +
      '<div class="cat-plant" data-stage="' + stage + '">' +
        '<div class="pct-badge">' + pctDisplay + '</div>' +
        plantSvg(cat) +
      '</div>' +
      '<div class="cat-main">' +
        '<div class="cat-head">' +
          '<span class="cat-icon">' + icon + '</span>' +
          '<span class="cat-name">' + escapeHTML(name) + '</span>' +
          '<span class="cat-count">' + count + ' question' + (count === 1 ? '' : 's') + '</span>' +
        '</div>' +
        '<div class="cat-tiles">' + tilesHTML + '</div>' +
      '</div>' +
    '</div>';

  function renderGardenSummary(total) {
    if (isGuest || !selectedPlayer) {
      return '<div class="garden-summary"><div><div class="garden-summary-title">Your Garden · Last 7 Days</div><div class="garden-summary-sub">' +
        (isGuest ? 'Sign in to grow your garden across Math, Language, and Challenges.' : 'Pick a player above to see their garden.') +
        '</div></div></div>';
    }
    return '<div class="garden-summary">' +
      '<div>' +
        '<div class="garden-summary-title">Your Garden · Last 7 Days</div>' +
        '<div class="garden-summary-sub">Each plant grows with the questions you answer</div>' +
      '</div>' +

  function renderGardenNudge(mix, total, gardenLabel) {
    if (total < 15) return '';
    var cats = [
      { id: 'math', label: 'Math', pct: (mix.math / total) * 100, count: mix.math },
      { id: 'language', label: gardenLabel, pct: (mix.language / total) * 100, count: mix.language },
      { id: 'challenges', label: 'Challenges', pct: (mix.challenges / total) * 100, count: mix.challenges }
    ];
    cats.sort(function(a, b) { return a.count - b.count; });
    if (cats[0].pct < 20 && cats[0].count < cats[2].count) {
      return '<div class="garden-nudge">🌱 Your <b>' + escapeHTML(cats[0].label) + '</b> plant needs watering — try one ' + escapeHTML(cats[0].label) + ' question next!</div>';

    return '';

  function launchConfettiRain() {
    const colors = ['#fbbf24','#f87171','#34d399','#818cf8','#f472b6','#38bdf8','#fb923c'];
    for (let i = 0; i < 120; i++) {
      setTimeout(() => {
        const p = document.createElement('div'); p.className = 'confetti-piece';
        p.style.left = Math.random()*100+'vw'; p.style.background = colors[Math.floor(Math.random()*colors.length)];
        p.style.width = (6+Math.random()*8)+'px'; p.style.height = (6+Math.random()*8)+'px';
        p.style.borderRadius = Math.random()>0.5?'50%':'2px'; p.style.animationDuration = (2+Math.random()*3)+'s';
        document.body.appendChild(p); setTimeout(() => p.remove(), 5000);
      }, i * 30);
    }
  }
  function playCelebrationSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523,659,784,1047,784,1047,1319].forEach((freq, i) => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, ctx.currentTime + i*0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.15 + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i*0.15); osc.stop(ctx.currentTime + i*0.15 + 0.4);
      });
    } catch(e) {}
  }

    ov.onclick = function(e) { if (e.target === ov) ov.remove(); };
    const cfg = getConfig();
    ov.innerHTML = '<div class="celeb10k-card"><span class="celeb10k-trophy">🏆</span><div class="celeb10k-title">10,000 POINTS!</div><div class="celeb10k-name">' + playerName + ' is a SUPERSTAR!</div><div class="jars-reveal"><div class="jar-reveal-card"><div class="jar-reveal-icon">🎉</div><div class="jar-reveal-label">Experience with Family</div><div class="jar-reveal-value">$' + pj.present.balance + '</div></div><div class="jar-reveal-card"><div class="jar-reveal-icon">💰</div><div class="jar-reveal-label">Investing Jar</div><div class="jar-reveal-value">$' + pj.investing.balance + '</div></div><div class="jar-reveal-card"><div class="jar-reveal-icon">💝</div><div class="jar-reveal-label">Give Back Jar</div><div class="jar-reveal-value">$' + pj.giveback.balance + '</div></div></div><div class="celeb10k-msg">You earned <strong>$' + cfg.experienceAmount + '</strong> toward a Family Experience — choose: Arcade Trip, Ice Cream Date, or Movie Night!<br>Plus <strong>$' + cfg.investingAmount + '</strong> in your Investing Jar and <strong>$' + cfg.givebackAmount + '</strong> in your Give Back Jar!</div><button class="celeb-close" onclick="this.closest(\'.celeb10k-overlay\').remove();">Amazing! Keep Going!</button></div>';
    document.body.appendChild(ov);
    const stats = getStats(); if (stats[playerName]) { stats[playerName] = { correct: 0, total: 0 }; saveStats(stats); }
    updateErrorBar(); render();
  }
  function checkCelebrations() {
    const scores = getScores(); const celebs = getCelebrations(); const players = getAccountPlayers();
    for (const p of players) {
      const score = scores[p.name] || 0; const acc = getAccuracy(p.name);
      const playerCeleb = celebs[p.name] || {};
      const last10K = playerCeleb.last10KMilestone || 0;
      const current10K = Math.floor(score / 10000) * 10000;
      if (current10K > 0 && current10K > last10K && acc !== null && acc >= 75) {
        if (typeof celebs[p.name] !== 'object' || celebs[p.name] === true) celebs[p.name] = { reached1K: true };
        celebs[p.name].last10KMilestone = current10K; saveCelebrations(celebs);
        setTimeout(() => show10KCelebration(p.name, score, acc), 800); return;
      }
      const reached1K = typeof playerCeleb === 'object' ? playerCeleb.reached1K : playerCeleb;
      if (score >= 1000 && !reached1K) {
        if (acc !== null && acc >= 75) {
          if (typeof celebs[p.name] !== 'object') celebs[p.name] = {};
          celebs[p.name].reached1K = true; saveCelebrations(celebs);
          setTimeout(() => showCelebration(p.name, score, acc), 800); return;
        }
      }
    }
  }

  // ---- Safety: auto-dismiss any stuck celebration overlays after 30s ----
  setTimeout(() => {
    document.querySelectorAll('.celebration-overlay, .celeb10k-overlay').forEach(el => {
      if (el.parentNode) el.remove();
    });
  }, 30000);

  // ---- Init ----
  if (!isGuest) {
    // Sync scores and account data from Firebase, then re-render
    if (typeof firebaseSyncScores === 'function') {
      firebaseSyncScores(currentAccountId, getScores(), function(merged) {
        localStorage.setItem('km_' + currentAccountId + '_scores', JSON.stringify(merged));
        console.log('[3Jars] Scores synced from Firebase:', merged);
        render(); // re-render with updated scores
      });
    }
    if (typeof firebaseSyncAccountData === 'function') {
      const accountData = getAccountData();
      firebaseSyncAccountData(currentAccountId, accountData, function(merged) {
        if (merged) {
          updateAccountData(merged);
          render(); // re-render with updated player data
        }
      });
    }
  }

  // Sync jars from Firebase
  if (typeof firebaseSyncJars === 'function') {
    firebaseSyncJars(currentAccountId, getJars(), function(merged) {
      localStorage.setItem('km_' + currentAccountId + '_jars', JSON.stringify(merged));
      console.log('[3Jars] Jars synced from Firebase:', merged);
      render();
    });
  }

  // Sync plays from Firebase (share-of-play counts)
  if (!isGuest && typeof window.firebaseSyncPlays === 'function') {
    window.firebaseSyncPlays(currentAccountId, function(merged) {
      console.log('[3Jars] Plays synced from Firebase:', merged);
      render();
    });
  }

    updateAccountBar(); render(); updateErrorBar(); if (!isGuest) checkCelebrations();
</script>
</body>
</html>
